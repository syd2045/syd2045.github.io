<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | Toko Undangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'vibe': 'vibe 2s infinite',
            'shimmer': 'shimmer 2.5s infinite',
            'fade-in': 'fadeIn 0.5s ease-out forwards',
          },
          keyframes: {
            vibe: { '0%': { transform: 'scale(1)', opacity: '0.8' }, '100%': { transform: 'scale(1.5)', opacity: '0' } },
            shimmer: { '100%': { left: '125%' } },
            fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    body { font-family: 'Poppins', sans-serif; background-color: #030712; color: white; }
    .grid-bg {
      background-image: linear-gradient(0deg, transparent 24%, rgba(59, 130, 246, 0.05) 25%, rgba(59, 130, 246, 0.05) 26%, transparent 27%, transparent 74%, rgba(139, 92, 246, 0.05) 75%, rgba(139, 92, 246, 0.05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(59, 130, 246, 0.05) 25%, rgba(59, 130, 246, 0.05) 26%, transparent 27%, transparent 74%, rgba(139, 92, 246, 0.05) 75%, rgba(139, 92, 246, 0.05) 76%, transparent 77%, transparent);
      background-size: 50px 50px; position: fixed; inset: 0; z-index: -1; animation: grid-move 20s linear infinite;
    }
    @keyframes grid-move { 0% { background-position: 0 0; } 100% { background-position: 50px 50px; } }
    .glass-dark { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

  <div class="grid-bg"></div>

  <div class="glass-dark rounded-[2rem] p-8 md:p-10 max-w-md w-full text-center relative shadow-2xl">
    
    <div class="mb-6 flex justify-center relative">
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 rounded-full bg-blue-500/20 animate-vibe"></div>
      </div>
      <div class="relative w-20 h-20 bg-gray-900 rounded-2xl flex items-center justify-center border border-blue-500/50 rotate-3 shadow-lg shadow-blue-500/20">
        <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
    </div>

    <div class="mb-6">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Menyiapkan Undangan...</h1>
      <div class="flex items-center justify-center gap-2 mt-2">
        <div class="h-1 w-12 bg-blue-500 rounded-full"></div>
        <span id="timer-count" class="text-sm font-mono text-gray-400">Loading 10s</span>
        <div class="h-1 w-12 bg-purple-500 rounded-full"></div>
      </div>
    </div>

    <div class="mb-8 p-4 rounded-xl bg-white/5 border border-white/10 text-left min-h-[100px] flex flex-col justify-center transition-all">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-xs font-bold uppercase tracking-widest text-blue-400">💡 Info Singkat</span>
        <div class="h-[1px] flex-grow bg-white/10"></div>
      </div>
      <p id="info-text" class="text-sm text-gray-300 leading-relaxed animate-fade-in">
        Tahukah kamu? Undangan digital jauh lebih hemat biaya dan ramah lingkungan loh!
      </p>
    </div>

    <div class="w-full bg-gray-800 h-1.5 rounded-full mb-8 overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
    </div>

    <button id="redirect-btn" class="relative w-full overflow-hidden py-4 font-bold text-white bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg active:scale-95 transition-transform group">
      <div class="absolute top-0 block w-1/2 h-full -left-full bg-gradient-to-r from-transparent via-white/20 to-transparent -skew-x-12 animate-shimmer"></div>
      <span class="relative">Akses Sekarang</span>
    </button>

  </div>

  <script>
    const TARGET_URL = "https://tokoundangan.pages.dev";
    const COUNTDOWN_SECONDS = 15;
    let timeLeft = COUNTDOWN_SECONDS;

    const facts = [
      "Undangan digital bisa dikirim ke ribuan tamu hanya dengan satu klik.",
      "Kamu bisa update revisi lokasi atau waktu kapan saja tanpa cetak ulang.",
      "Fitur RSVP membantu kamu mendata jumlah tamu yang akan hadir secara otomatis.",
      "Undangan digital Toko Undangan mendukung integrasi Google Maps dan Kalender.",
      "Kamu bisa menambahkan musik romantis favoritmu di dalam undangan digital.",
      "Gak perlu amplop fisik! Kamu bisa sertakan fitur 'Kado Digital' di dalamnya."
    ];

    const infoTextEl = document.getElementById('info-text');
    const timerCountEl = document.getElementById('timer-count');
    const progressBarEl = document.getElementById('progress-bar');
    const redirectBtn = document.getElementById('redirect-btn');

    // Change info text every 3 seconds
    let factIndex = 0;
    const factInterval = setInterval(() => {
      factIndex = (factIndex + 1) % facts.length;
      infoTextEl.style.opacity = 0;
      setTimeout(() => {
        infoTextEl.textContent = facts[factIndex];
        infoTextEl.style.opacity = 1;
      }, 300);
    }, 3500);

    function redirectToSite() {
      clearInterval(factInterval);
      redirectBtn.disabled = true;
      redirectBtn.textContent = "Membuka Portal...";
      window.location.href = TARGET_URL;
    }

    const timer = setInterval(() => {
      timeLeft--;
      timerCountEl.textContent = `Loading ${timeLeft}s`;
      
      const percentage = (timeLeft / COUNTDOWN_SECONDS) * 100;
      progressBarEl.style.width = `${percentage}%`;

      if (timeLeft <= 0) {
        clearInterval(timer);
        redirectToSite();
      }
    }, 1000);

    redirectBtn.addEventListener('click', () => {
      clearInterval(timer);
      redirectToSite();
    });
  </script>
</body>
</html>
