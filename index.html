<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | Toko Undangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    .timer-ring {
      conic-gradient: conic-gradient(#3b82f6 0%, #e5e7eb 0%);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen flex items-center justify-center p-4">

  <!-- Main Card -->
  <div class="bg-white rounded-2xl shadow-xl p-8 md:p-10 max-w-md w-full text-center border border-gray-100 transform transition-all hover:shadow-2xl">
    
    <!-- Logo/Icon -->
    <div class="mb-6 flex justify-center">
      <div class="relative">
        <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg animate-pulse-slow">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
          </svg>
        </div>
        <div class="absolute -top-1 -right-1 w-6 h-6 bg-green-500 rounded-full border-4 border-white animate-bounce-slow"></div>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3">
      🎉 Mengalihkan...
    </h1>
    
    <!-- Subtitle -->
    <p class="text-gray-600 mb-6 leading-relaxed">
      Anda akan diarahkan ke <span class="font-semibold text-indigo-600">Toko Undangan</span> dalam beberapa detik.
    </p>

    <!-- Timer Display -->
    <div class="mb-8">
      <div class="inline-flex items-center justify-center w-24 h-24 bg-gray-50 rounded-full border-4 border-indigo-100 relative overflow-hidden">
        <!-- Circular Progress Background -->
        <svg class="absolute w-full h-full transform -rotate-90" viewBox="0 0 100 100">
          <circle 
            class="text-gray-200" 
            stroke-width="8" 
            stroke="currentColor" 
            fill="transparent" 
            r="40" 
            cx="50" 
            cy="50" 
          />
          <circle 
            id="timer-progress"
            class="text-indigo-500 transition-all duration-1000 ease-linear" 
            stroke-width="8" 
            stroke-dasharray="251.2" 
            stroke-dashoffset="0" 
            stroke="currentColor" 
            fill="transparent" 
            r="40" 
            cx="50" 
            cy="50" 
            stroke-linecap="round"
          />
        </svg>
        <!-- Timer Number -->
        <span id="timer-count" class="text-3xl font-bold text-indigo-600 z-10">3</span>
      </div>
      <p class="text-sm text-gray-500 mt-3">detik tersisa</p>
    </div>

    <!-- Destination URL -->

    <!-- Manual Redirect Button -->
    <button 
      id="redirect-btn"
      onclick="redirectToSite()"
      class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2 group"
    >
      <span>Lanjut Sekarang</span>
      <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
      </svg>
    </button>

    <!-- Footer Note -->
    <p class="mt-6 text-xs text-gray-400">
      Jika tidak diarahkan otomatis, klik tombol di atas.
    </p>
  </div>

  <!-- Decorative Elements -->
  <div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-10">
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 2s"></div>
  </div>

  <!-- JavaScript for Redirect & Timer -->
  <script>
    const TARGET_URL = "https://tokoundangan.pages.dev";
    const COUNTDOWN_SECONDS = 3;
    
    let timeLeft = COUNTDOWN_SECONDS;
    const timerCountEl = document.getElementById('timer-count');
    const timerProgressEl = document.getElementById('timer-progress');
    const redirectBtn = document.getElementById('redirect-btn');
    
    // Circular progress calculation
    const radius = 40;
    const circumference = 2 * Math.PI * radius;
    
    function updateProgress() {
      const offset = circumference - (timeLeft / COUNTDOWN_SECONDS) * circumference;
      timerProgressEl.style.strokeDashoffset = offset;
    }
    
    function redirectToSite() {
      // Disable button to prevent multiple clicks
      redirectBtn.disabled = true;
      redirectBtn.innerHTML = `
        <svg class="animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>Mengalihkan...</span>
      `;
      
      // Redirect
      window.location.href = TARGET_URL;
    }
    
    // Countdown Timer
    const timer = setInterval(() => {
      timeLeft--;
      
      // Update display
      timerCountEl.textContent = timeLeft;
      updateProgress();
      
      // Visual feedback
      if (timeLeft <= 1) {
        timerCountEl.classList.add('text-red-500');
        timerCountEl.classList.remove('text-indigo-600');
      }
      
      if (timeLeft <= 0) {
        clearInterval(timer);
        redirectToSite();
      }
    }, 1000);
    
    // Initialize progress
    updateProgress();
    
    // Allow manual click anytime
    redirectBtn.addEventListener('click', () => {
      clearInterval(timer);
      redirectToSite();
    });
    
    // Keyboard support (Enter key)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearInterval(timer);
        redirectToSite();
      }
    });
  </script>
</body>
</html>
